name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Generate image tag from git short SHA ────────────────────────────
      - name: Set image tag
        id: tag
        run: echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # ── 3. Log in to Docker Hub ─────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 4. Set up Docker Buildx ─────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 5. Build and push backend image ────────────────────────────────────
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-healthcheck-app:${{ steps.tag.outputs.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-healthcheck-app:latest

      # ── 6. Build and push UI image ──────────────────────────────────────────
      - name: Build and push UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ui
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-healthcheck-ui:${{ steps.tag.outputs.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-healthcheck-ui:latest

      # ── 7. Update docker-compose.yml with new image tags ────────────────────
      - name: Update docker-compose with new tags
        run: |
          sed -i "s|image: .*/devops-healthcheck-app:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/devops-healthcheck-app:${{ steps.tag.outputs.TAG }}|g" docker-compose.yml
          sed -i "s|image: .*/devops-healthcheck-ui:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/devops-healthcheck-ui:${{ steps.tag.outputs.TAG }}|g" docker-compose.yml

      # ── 8. Commit updated docker-compose back to repo ───────────────────────
      - name: Commit and push updated docker-compose
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ steps.tag.outputs.TAG }} [skip ci]"
          git push 